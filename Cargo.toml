[workspace]
resolver = "3"
members = [
    "lu-common",
    "freshcheck",
    "stamp",
    "lu-match",
    "lu-expand",
    "lu-query",
    "lu-rule",
    "lu-queue",
    "lu-par",
    "lu-deps",
    "lu-multi",
    "logicutils-translator-to-oxiz-sat",
]

[workspace.package]
# v0.x-smt branch ⇔ adsmt version synchronisation rule (revised
# 2026-05-29 from the original "+2" offset to a "match-minor"
# convention; both workspaces have shared the same minor version
# since the v0.17 mid-cycle audit).
#
# adsmt minor bump ⇒ matching logicutils minor bump in the same
# conceptual unit. Patch bumps are independent (logicutils may
# patch ahead of adsmt for additive feature work — see 0.17.1
# below — and vice versa).
#
# 0.17.1 → 0.18.0 minor bump: synchronises with adsmt 0.17 →
# 0.18 cycle bump. Carries the K12 feature + the
# `logicutils-translator-to-oxiz-sat` subcrate forward as 0.18.0
# baseline; both already shipped under 0.17.1.
version = "0.18.0"
edition = "2024"
license = "BSD-2-Clause"
repository = "https://github.com/logicutils/logicutils"

[workspace.dependencies]
lu-common = { path = "lu-common" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
blake3 = "1.8"
crc32fast = "1.5"
crc = "3"
toml = "1.1"
csv = "1.4"
thiserror = "2.0"
glob = "0.3.3"

[profile.release]
lto = "thin"