[workspace]
resolver = "3"
members = [
    "lu-common",
    "freshcheck",
    "stamp",
    "lu-match",
    "lu-expand",
    "lu-query",
    "lu-rule",
    "lu-queue",
    "lu-par",
    "lu-deps",
    "lu-multi",
]

[workspace.package]
# v0.x-smt branch versioning rule: minor = adsmt minor + 2.
# adsmt v0.3 ⇒ logicutils v0.x-smt v0.5.
# Patch bump 0.17.0 → 0.17.1 lands the new optional `k12` feature
# in lu-common (KangarooTwelve-256 hash + customization-string
# domain separation) as the foundation for adsmt's
# breaking-version frozen-hash safeguard. Feature is opt-in and
# additive, so the bump is a patch per the relationship rule's
# compatibility-emphasis policy (λ-1-b.lu-ver = β in the
# 2026-05-29 design discussion).
version = "0.17.1"
edition = "2024"
license = "BSD-2-Clause"
repository = "https://github.com/logicutils/logicutils"

[workspace.dependencies]
lu-common = { path = "lu-common" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
blake3 = "1.8"
crc32fast = "1.5"
crc = "3"
toml = "1.1"
csv = "1.4"
thiserror = "2.0"
glob = "0.3.3"

[profile.release]
lto = "thin"